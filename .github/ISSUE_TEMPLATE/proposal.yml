name: Integration or feature proposal
description: A new adapter, harness use case, SDK feature or documentation improvement.
title: "[Proposal] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the use case and the current obstacle.
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Proposed approach and tradeoffs
      description: Include alternatives, engine assumptions and any evidence needed for a new claim.
    validations:
      required: true
