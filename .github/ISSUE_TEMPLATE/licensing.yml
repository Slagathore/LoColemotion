name: Licensing or commercial inquiry
description: Start a non-confidential conversation about covered source or commercial rights.
title: "[Licensing] "
body:
  - type: markdown
    attributes:
      value: Do not post financial details, private customer information or contracts here. We can establish a private contact route first. An inquiry does not create license rights.
  - type: textarea
    id: scope
    attributes:
      label: Intended use and requested scope
      description: SDK integration, private SDK modifications, harness reuse or other material. A general description is enough.
    validations:
      required: true
